<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>股票代號辨識（Google OCR版）</title>

<style>
body { margin:0; background:black; }

video {
  width:100%;
}

/* 掃描框 */
#scanBox {
  position: fixed;
  top: 35%;
  left: 10%;
  width: 80%;
  height: 20%;
  border: 2px solid #00ffcc;
}

/* 按鈕 */
#btn {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 20px;
  font-size: 18px;
}

/* 結果 */
#result {
  position: fixed;
  bottom: 20px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 24px;
  background: rgba(0,0,0,0.7);
  color: #00ffcc;
  padding: 10px;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>
<div id="scanBox"></div>

<button id="btn">📸 辨識股票</button>
<div id="result">準備中...</div>

<script>
// 🔥 在這裡貼你的 API KEY
const API_KEY = "AIzaSyDBkTyVVS_wfaIqaGrybx4WfSsyTGgkdn0";

  
// 📦 股票資料
const stocks = [
  { name: "台積電", code: "2330" },
  { name: "鴻海", code: "2317" },
  { name: "聯發科", code: "2454" },
  { name: "中華電信", code: "2412" },
  { name: "國泰金", code: "2882" }
];

// 🔍 找公司
function findCompany(text) {
  return stocks.find(s => text.includes(s.name));
}

// 🎯 判斷
function detect(text) {

  console.log("OCR結果:", text);

  const company = findCompany(text);
  if (company) {
    return `股票代號：${company.code}（${company.name}）`;
  }

  const nums = text.match(/\d{4}/g);
  if (nums) {
    return `股票代號（推測）：${nums[0]}`;
  }

  return "找不到";
}

// 📷 開相機
const video = document.getElementById("camera");

navigator.mediaDevices.getUserMedia({
  video: {
    facingMode: "environment",
    width: { ideal: 1280 },
    height: { ideal: 720 }
  }
}).then(stream => {
  video.srcObject = stream;
}).catch(err => {
  document.getElementById("result").innerText =
    "相機錯誤：" + err.message;
});

// 🔥 Google OCR
async function detectWithGoogle(canvas) {

  const base64 = canvas.toDataURL("image/jpeg").split(",")[1];

  const response = await fetch(
    `https://vision.googleapis.com/v1/images:annotate?key=${API_KEY}`,
    {
      method: "POST",
      body: JSON.stringify({
        requests: [
          {
            image: { content: base64 },
            features: [{ type: "TEXT_DETECTION" }]
          }
        ]
      })
    }
  );

  const data = await response.json();

  const text =
    data.responses?.[0]?.fullTextAnnotation?.text || "";

  return text;
}

// 📸 按鈕
document.getElementById("btn").onclick = async () => {

  document.getElementById("result").innerText = "辨識中...";

  const canvas = document.createElement("canvas");

  const w = video.videoWidth;
  const h = video.videoHeight;

  canvas.width = w;
  canvas.height = h;

  const ctx = canvas.getContext("2d");

  // 🔥 只抓掃描框區域（提升準確率）
  ctx.drawImage(
    video,
    w * 0.1, h * 0.35,
    w * 0.8, h * 0.25,
    0, 0,
    canvas.width, canvas.height
  );

  try {
    const text = await detectWithGoogle(canvas);

    const result = detect(text);
    document.getElementById("result").innerText = result;

  } catch (e) {
    document.getElementById("result").innerText = "辨識失敗";
  }
};

</script>

</body>
</html>
