<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>股票代號辨識（最穩定版）</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4"></script>

<style>
body { margin:0; background:black; }

video {
  width:100%;
}

/* 中央掃描框 */
#scanBox {
  position: fixed;
  top: 35%;
  left: 10%;
  width: 80%;
  height: 20%;
  border: 2px solid #00ffcc;
  box-sizing: border-box;
}

/* 按鈕 */
#btn {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 20px;
  font-size: 18px;
}

/* 結果 */
#result {
  position: fixed;
  bottom: 20px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 24px;
  background: rgba(0,0,0,0.7);
  color: #00ffcc;
  padding: 10px;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>
<div id="scanBox"></div>

<button id="btn">📸 辨識股票</button>
<div id="result">初始化中...</div>

<script>
// 📦 股票資料（可擴充）
const stocks = [
  { name: "台積電", code: "2330" },
  { name: "鴻海", code: "2317" },
  { name: "聯發科", code: "2454" },
  { name: "中華電信", code: "2412" },
  { name: "國泰金", code: "2882" }
];

// 🔤 簡單模糊比對
function similarity(a, b) {
  let same = 0;
  for (let i = 0; i < b.length; i++) {
    if (a.includes(b[i])) same++;
  }
  return same / b.length;
}

// 🔍 找公司
function findCompany(text) {
  let best = null;
  let bestScore = 0;

  stocks.forEach(s => {
    let score = similarity(text, s.name);
    if (score > bestScore && score > 0.5) {
      bestScore = score;
      best = s;
    }
  });

  return best;
}

// 🎯 判斷
function detect(text) {

  console.log("OCR結果:", text);

  const company = findCompany(text);
  if (company) {
    return `股票代號：${company.code}（${company.name}）`;
  }

  const nums = text.match(/\d{4}/g);
  if (nums) {
    return `股票代號（推測）：${nums[0]}`;
  }

  return "找不到";
}

// 📷 開相機（後鏡頭）
const video = document.getElementById("camera");

navigator.mediaDevices.getUserMedia({
  video: {
    facingMode: "environment",
    width: { ideal: 1280 },
    height: { ideal: 720 }
  }
}).then(stream => {
  video.srcObject = stream;
}).catch(err => {
  document.getElementById("result").innerText =
    "相機錯誤：" + err.message;
});

// 🔥 OCR Worker
let worker;

async function initOCR() {
  worker = await Tesseract.createWorker({
    logger: m => console.log(m)
  });

  await worker.loadLanguage('chi_tra');
  await worker.initialize('chi_tra');

  // 🔥 白名單（提升準確度）
  await worker.setParameters({
    tessedit_char_whitelist:
      '0123456789台積電鴻海聯發科中華電信國泰金'
  });

  document.getElementById("result").innerText = "準備完成";
}

initOCR();

// 📸 按鈕辨識
document.getElementById("btn").onclick = async () => {

  document.getElementById("result").innerText = "辨識中...";

  const canvas = document.createElement("canvas");

  const w = video.videoWidth;
  const h = video.videoHeight;

  canvas.width = w * 2;
  canvas.height = h * 2;

  const ctx = canvas.getContext("2d");

  // 🔥 圖像強化
  ctx.filter = "contrast(150%) brightness(110%) grayscale(100%)";

  // 🔥 只抓中間區域（掃描框）
  ctx.drawImage(
    video,
    w * 0.1, h * 0.35,   // 起點
    w * 0.8, h * 0.25,   // 範圍
    0, 0,
    canvas.width, canvas.height
  );

  try {
    const { data: { text } } = await worker.recognize(canvas);

    const result = detect(text);
    document.getElementById("result").innerText = result;

  } catch (e) {
    document.getElementById("result").innerText = "辨識失敗";
  }
};

</script>

</body>
</html>
