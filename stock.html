<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- 鎖定螢幕縮放，確保手機上的按鈕跟字體大小固定，方便長輩閱讀 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>股票代號線上簡易登記</title>

  <style>
    :root {
      --primary-color: #00ffcc;
      --bg-color: #0a0a0a;
      --card-bg: #1e1e1e;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-color);
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 15px;
      text-align: center;
      background: var(--card-bg);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    /* 放大的標題 */
    h2 { margin: 0; font-size: 28px; letter-spacing: 2px; color: var(--primary-color); }

    /* 相機畫面 */
    #cameraContainer {
      flex: 1;
      position: relative;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 清楚的掃描框導引 */
    #scanBox {
      position: absolute;
      width: 80%;
      height: 25%;
      border: 3px solid var(--primary-color);
      border-radius: 12px;
      box-shadow: 0 0 0 5000px rgba(0, 0, 0, 0.6);
      z-index: 5;
    }

    #scanBox::after {
      content: "請將公司名或代號對準框內";
      position: absolute;
      bottom: -35px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: var(--primary-color);
      text-shadow: 1px 1px 2px black;
    }

    /* 高對比與大字體的結果顯示區 */
    #resultCard {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 20px 20px 0 0;
      text-align: center;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
    }

    #result {
      font-size: 26px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 20px;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: pre-line; /* 允許文字換行 */
    }

    /* 友善的大按鈕 */
    #btn {
      width: 100%;
      padding: 22px;
      font-size: 26px;
      border-radius: 15px;
      border: none;
      background: linear-gradient(135deg, #00ffcc 0%, #00c896 100%);
      color: #053329;
      font-weight: 900;
      box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
      touch-action: manipulation;
    }

    #btn:active {
      background: #00a87a;
      transform: scale(0.98);
    }
  </style>
</head>

<body>

<header>
  <h2>📸 股票代號掃描</h2>
</header>

<div id="cameraContainer">
  <video id="camera" autoplay playsinline></video>
  <div id="scanBox"></div>
</div>

<div id="resultCard">
  <div id="result">點擊下方按鈕開始</div>
  <button id="btn">🔍 辨識股票</button>
</div>

<!-- 這就是你問的 JS，包在 script 標籤裡面 -->
<script>
// 🔥 API KEY
const API_KEY = "AIzaSyDBkTyVVS_wfaIqaGrybx4WfSsyTGgkdn0";

// 📦 ==========================================
// 請用「記事本」打開你的 股票代號.csv
// 全選裡面的文字，複製，然後覆蓋掉下面這幾行！
// ==========================================
const rawCSVData = `公司名稱,公司簡稱,公司代號
茂生農經股份有限公司,茂生農經,1240
安心食品服務股份有限公司,安心,1259
德麥食品股份有限公司,德麥,1264
漢來美食股份有限公司,漢來美食,1268
漢田生技股份有限公司,漢田生技,1294`; 
// ↑↑↑ 貼到上面為止 ↑↑↑

// 這段 JS 會自動幫你把 CSV 文字變成程式可以看得懂的資料庫
function parseCSV(csvText) {
  const lines = csvText.trim().split(/\r?\n/);
  const data = [];
  // i=1 是為了跳過第一行的「公司名稱,公司簡稱,公司代號」
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(",");
    if (cols.length >= 3) {
      // n: 全名, s: 簡稱, c: 代號
      data.push({ n: cols[0].trim(), s: cols[1].trim(), c: cols[2].trim() });
    }
  }
  return data;
}

const stockData = parseCSV(rawCSVData);

// 🎯 三層過濾的辨識邏輯
function detect(ocrText) {
  if (!ocrText) return "⚠️ 畫面太模糊\n請再對準一點";
  
  // 清除空白與換行，避免干擾
  const cleanText = ocrText.replace(/\s+/g, "");

  // 1. 最精準：先找 4 位數代號
  const codeMatch = cleanText.match(/\b\d{4}\b/g);
  if (codeMatch) {
    // 排除年份
    const validCode = codeMatch.find(n => n !== "2026" && n !== "2025");
    if (validCode) {
      const found = stockData.find(item => item.c === validCode);
      if (found) return `🟢 辨識成功！\n代號：${found.c}\n(${found.s})`;
    }
  }

  // 2. 次精準：找公司簡稱 (文字少，辨識率高)
  const byShortName = stockData.find(item => cleanText.includes(item.s));
  if (byShortName) {
    return `🟢 辨識成功！\n代號：${byShortName.c}\n(${byShortName.s})`;
  }

  // 3. 找公司全名 (如果 OCR 讀到了完整名稱)
  const byFullName = stockData.find(item => cleanText.includes(item.n) || item.n.includes(cleanText));
  if (byFullName && cleanText.length >= 2) { 
    return `🟢 辨識成功！\n代號：${byFullName.c}\n(${byFullName.s})`;
  }

  return "⚠️ 找不到對應股票\n請重新掃描";
}

// 📷 相機與畫面設定
const video = document.getElementById("camera");
const resultDiv = document.getElementById("result");
const btn = document.getElementById("btn");

navigator.mediaDevices.getUserMedia({
  video: {
    facingMode: "environment", // 啟動手機後鏡頭
    width: { ideal: 1920 },
    height: { ideal: 1080 }
  }
}).then(stream => {
  video.srcObject = stream;
}).catch(err => {
  resultDiv.innerText = "❌ 無法開啟相機\n請確認權限";
});

// 🔘 按鈕點擊動作
btn.onclick = async () => {
  resultDiv.innerText = "讀取影像中...\n請稍候";
  btn.disabled = true;

  const canvas = document.createElement("canvas");
  const w = video.videoWidth;
  const h = video.videoHeight;
  
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");

  // 裁切畫面，只抓取框框內的畫面送去辨識
  const clipW = w * 0.8;
  const clipH = h * 0.25;
  const clipX = (w - clipW) / 2;
  const clipY = (h - clipH) / 2;

  ctx.drawImage(video, clipX, clipY, clipW, clipH, 0, 0, canvas.width, canvas.height);

  try {
    const base64 = canvas.toDataURL("image/jpeg", 0.8).split(",")[1];
    const response = await fetch(
      `https://vision.googleapis.com/v1/images:annotate?key=${API_KEY}`,
      {
        method: "POST",
        body: JSON.stringify({
          requests: [{
            image: { content: base64 },
            features: [{ type: "TEXT_DETECTION" }]
          }]
        })
      }
    );

    const data = await response.json();
    const detectedText = data.responses?.[0]?.fullTextAnnotation?.text || "";
    
    // 呼叫上面的辨識邏輯
    resultDiv.innerText = detect(detectedText);

  } catch (e) {
    resultDiv.innerText = "❌ 網路連線失敗\n請檢查網路";
  } finally {
    btn.disabled = false;
  }
};
</script>

</body>
</html>
