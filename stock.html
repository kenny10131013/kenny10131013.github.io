<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>股票代號辨識（優化版）</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4"></script>

<style>
body { margin:0; background:black; }
video { width:100%; }

#btn {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 20px;
  font-size: 18px;
}

#result {
  position: fixed;
  bottom: 20px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 24px;
  background: rgba(0,0,0,0.7);
  color: #00ffcc;
  padding: 10px;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>
<button id="btn">📸 辨識股票</button>
<div id="result">準備中...</div>

<script>
// 📦 股票資料（先少量，之後可換JSON）
const stocks = [
  { name: "台積電", code: "2330" },
  { name: "鴻海", code: "2317" },
  { name: "聯發科", code: "2454" },
  { name: "中華電信", code: "2412" },
  { name: "國泰金", code: "2882" }
];

// 🔤 模糊比對
function similarity(a, b) {
  let longer = a.length > b.length ? a : b;
  let shorter = a.length > b.length ? b : a;
  let same = 0;
  for (let i = 0; i < shorter.length; i++) {
    if (longer.includes(shorter[i])) same++;
  }
  return same / longer.length;
}

// 🔍 找公司
function findCompany(text) {
  let best = null;
  let score = 0;

  stocks.forEach(s => {
    let sScore = similarity(text, s.name);
    if (sScore > score && sScore > 0.5) {
      score = sScore;
      best = s;
    }
  });

  return best;
}

// 🎯 判斷股票
function detect(text) {

  const company = findCompany(text);
  if (company) {
    return `股票代號：${company.code}（${company.name}）`;
  }

  const nums = text.match(/\d{4}/g);
  if (nums) {
    return `股票代號（推測）：${nums[0]}`;
  }

  return "找不到";
}

// 📷 開相機（後鏡頭 + 高解析度）
const video = document.getElementById("camera");

navigator.mediaDevices.getUserMedia({
  video: {
    facingMode: "environment",
    width: { ideal: 1280 },
    height: { ideal: 720 }
  }
}).then(stream => {
  video.srcObject = stream;
});

// 🔥 OCR worker（關鍵）
let worker;

async function initOCR() {
  worker = await Tesseract.createWorker();
  await worker.loadLanguage('chi_tra+eng');
  await worker.initialize('chi_tra+eng');
  document.getElementById("result").innerText = "準備完成";
}

initOCR();

// 📸 按鈕辨識
document.getElementById("btn").onclick = async () => {

  document.getElementById("result").innerText = "辨識中...";

  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");

  // 🔥 圖像強化
  ctx.filter = "contrast(150%) brightness(110%) grayscale(100%)";
  ctx.drawImage(video, 0, 0);

  try {
    const { data: { text } } = await worker.recognize(canvas);

    console.log(text);

    const result = detect(text);
    document.getElementById("result").innerText = result;

  } catch (e) {
    document.getElementById("result").innerText = "辨識失敗";
  }
};

</script>

</body>
</html>
