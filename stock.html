<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>股票代號辨識</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #111;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* 📷 相機容器 */
#cameraContainer {
  width: 90%;
  max-width: 400px;
  height: 260px;
  margin-top: 20px;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  background: black;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 🎯 掃描框 */
#scanBox {
  position: absolute;
  top: 30%;
  left: 10%;
  width: 80%;
  height: 40%;
  border: 3px solid #00ffcc;
  border-radius: 8px;
}

/* 📢 結果 */
#result {
  margin-top: 20px;
  font-size: 22px;
  text-align: center;
  min-height: 50px;
}

/* 🔘 按鈕 */
#btn {
  margin-top: 20px;
  width: 80%;
  max-width: 300px;
  padding: 16px;
  font-size: 20px;
  border-radius: 10px;
  border: none;
  background: #00c896;
  color: white;
  font-weight: bold;
}

#btn:active {
  background: #00a87a;
}

</style>
</head>

<body>

<h2>📸 股票代號辨識</h2>

<div id="cameraContainer">
  <video id="camera" autoplay playsinline></video>
  <div id="scanBox"></div>
</div>

<button id="btn">辨識股票</button>

<div id="result">準備中...</div>

<script>

// 🔥 API KEY
const API_KEY = "AIzaSyDBkTyVVS_wfaIqaGrybx4WfSsyTGgkdn0";

// 📦 股票資料
const stocks = [
  { name: "台積電", code: "2330" },
  { name: "鴻海", code: "2317" },
  { name: "聯發科", code: "2454" },
  { name: "中華電信", code: "2412" },
  { name: "國泰金", code: "2882" }
];

// 🔍 找公司
function findCompany(text) {
  return stocks.find(s => text.includes(s.name));
}

// 🎯 判斷
function detect(text) {

  console.log("OCR:", text);

  const company = findCompany(text);
  if (company) {
    return `股票代號：${company.code}（${company.name}）`;
  }

  const nums = text.match(/\d{4}/g);
  if (nums) {
    return `股票代號（推測）：${nums[0]}`;
  }

  return "找不到";
}

// 📷 相機
const video = document.getElementById("camera");

navigator.mediaDevices.getUserMedia({
  video: {
    facingMode: "environment",
    width: { ideal: 1280 },
    height: { ideal: 720 }
  }
}).then(stream => {
  video.srcObject = stream;
}).catch(err => {
  document.getElementById("result").innerText = "相機錯誤：" + err.message;
});

// 🔥 Google OCR
async function detectWithGoogle(canvas) {

  const base64 = canvas.toDataURL("image/jpeg").split(",")[1];

  const response = await fetch(
    `https://vision.googleapis.com/v1/images:annotate?key=${API_KEY}`,
    {
      method: "POST",
      body: JSON.stringify({
        requests: [
          {
            image: { content: base64 },
            features: [{ type: "TEXT_DETECTION" }]
          }
        ]
      })
    }
  );

  const data = await response.json();

  console.log("API回傳:", data);

  if (data.error) {
    return "❌ 錯誤：" + data.error.message;
  }

  return data.responses?.[0]?.fullTextAnnotation?.text || "";
}

// 📸 按鈕
document.getElementById("btn").onclick = async () => {

  const resultDiv = document.getElementById("result");
  resultDiv.innerText = "辨識中...";

  const canvas = document.createElement("canvas");

  const w = video.videoWidth;
  const h = video.videoHeight;

  canvas.width = w;
  canvas.height = h;

  const ctx = canvas.getContext("2d");

  // 🎯 只抓掃描框
  ctx.drawImage(
    video,
    w * 0.1, h * 0.3,
    w * 0.8, h * 0.4,
    0, 0,
    canvas.width, canvas.height
  );

  try {
    const text = await detectWithGoogle(canvas);

    if (text.startsWith("❌")) {
      resultDiv.innerText = text;
      return;
    }

    const result = detect(text);
    resultDiv.innerText = result;

  } catch (e) {
    resultDiv.innerText = "❌ 系統錯誤";
  }
};

</script>

</body>
</html>
